---
services:
  nginx:
      container_name: nginx
      build:
        context: ./nginx
        dockerfile: Dockerfile
      ports:
        - "${HTTP_PORT:-8080}:80"
        - "${HTTPS_PORT:-8443}:443"
      volumes:
        - static_volume:/app/staticfiles:ro
        - media_volume:/app/media:ro
      depends_on:
        - backend
        - frontend
      restart: unless-stopped
      networks:
        - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000"
    env_file:
      - .env
    environment:
      # SQLite file lives on a volume owned by the backend service. There is no
      # database container: one service, one file, one backup to copy.
      DB_DIR: /app/data
    restart: unless-stopped
    volumes:
      - sqlite_data:/app/data
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/projects/', timeout=10)"]
      interval: 30s
      timeout: 30s
      start_period: 5s
      retries: 3
    networks:
        - app-network

  frontend:
      container_name: frontend
      build:
        context: ./frontend
        dockerfile: Dockerfile
      restart: unless-stopped
      depends_on:
        - backend
      networks:
        - app-network


  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel --origincert /run/secrets/cloudflare_origin_cert --credentials-file /run/secrets/cloudflare_tunnel_credentials --url http://nginx:80 run 3cc69b7d-b6bc-4708-90c3-fc77426e7391
    secrets:
      - cloudflare_tunnel_credentials
      - cloudflare_origin_cert
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - production  # Only run when 'production' profile is active

volumes:
  sqlite_data:
  static_volume:
  media_volume:

networks:
  app-network:
    driver: bridge

secrets:
  cloudflare_tunnel_credentials:
    file: ./cloudflare_tunnel_credentials.json
  cloudflare_origin_cert:
    file: ./cloudflare_origin_cert.pem
